# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# Minecraft 26.1 is unobfuscated - there is no "mappings" dependency at
# all (Yarn is deprecated as of 26.1 and does not publish for it).
minecraft_version=26.1.2
loader_version=0.18.6

# Mod Properties
mod_version=1.0.0
maven_group=eu.tomaseu
archives_base_name=browsergui

# Dependencies
fabric_api_version=0.145.3+26.1.1
loom_version=1.15.5

# MCEF (Keksuccino's fork) dependency.
# Confirmed directly from the project's own README
# (github.com/Keksuccino/mcef, 26.1.1 branch):
#   group:      de.keksuccino
#   artifact:   mcef-fabric
#   version:    2.2.0-26.1.1  (format is <mod_version>-<minecraft_version>)
#   repository: https://keksuccino.github.io/maven/
mcef_version=2.2.0-26.1.1
